# API (FastAPI/uvicorn). Образ собирается из apps/api и пушится в реестр
# (см. infra/k8s/README.md). Тот же образ используют worker и init-миграции.
#
# initContainers решают зависимость, которую в compose делал
# `service_completed_successfully`:
#   1) wait-postgres — ждём готовности БД (busybox, TCP-проба);
#   2) migrate — `alembic upgrade head`. api всегда 1 реплика, поэтому
#      миграции выполняются ровно один раз, без гонки нескольких подов
#      и без отдельного Job/RBAC. worker дожидается готовности api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-message
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: registry-cred
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 2;
              done
        - name: migrate
          image: ai-mesaas.cr.cloud.ru/ai-message-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ai-message-config
            - secretRef:
                name: ai-message-secrets
      containers:
        - name: api
          image: ai-mesaas.cr.cloud.ru/ai-message-api:latest
          command: ["./entrypoint.sh", "serve"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-message-config
            - secretRef:
                name: ai-message-secrets
          # Холодный старт грузит torch/sentence-transformers — даём время
          # startupProbe (до 60×3=180с), и только потом включаем liveness.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-message
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
