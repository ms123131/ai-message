# Воркер фоновых задач (arq). Тот же образ, что и api, другой entrypoint.
# Стартует после api: к моменту, когда api отвечает на :8000, миграции уже
# применены его init-контейнером — значит схема БД готова и для воркера.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-message
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: registry-cred
      initContainers:
        - name: wait-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z api 8000; do
                echo "waiting for api (migrations)..."; sleep 2;
              done
      containers:
        - name: worker
          image: ai-mesaas.cr.cloud.ru/ai-message-api:latest
          command: ["./entrypoint.sh", "run-worker"]
          envFrom:
            - configMapRef:
                name: ai-message-config
            - secretRef:
                name: ai-message-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 2560Mi
