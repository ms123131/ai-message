# PostgreSQL 16 + pgvector. Stateful: данные на отдельном CSI-томе
# (cloudru-ssd), независимом от диска ноды — переживает пересоздание пода
# и ноды. Одна реплика, strategy: Recreate (RWO-том нельзя примонтировать
# к двум подам сразу).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-message
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: cloudru-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-message
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: ai-message-config   # POSTGRES_USER, POSTGRES_DB
            - secretRef:
                name: ai-message-secrets  # POSTGRES_PASSWORD
          env:
            # Данные в подкаталог, чтобы lost+found в корне тома не мешал initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-message
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
