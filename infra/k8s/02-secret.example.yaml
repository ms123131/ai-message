# ШАБЛОН секрета — этот файл коммитится в git с плейсхолдерами.
# Реальные значения положите в 02-secret.yaml (он в .gitignore) и применяйте
# его вместо этого. Либо создайте секрет императивно (см. infra/k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: ai-message-secrets
  namespace: ai-message
type: Opaque
stringData:
  # Пароль postgres и полный DSN (asyncpg). Host=postgres — имя Service.
  POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"
  DATABASE_URL: "postgresql+asyncpg://aimessage:__POSTGRES_PASSWORD__@postgres:5432/aimessage"

  JWT_SECRET: "__JWT_SECRET__"
  # Fernet-ключ для шифрования токенов интеграций (base64, 32 байта).
  ENCRYPTION_KEY: "__ENCRYPTION_KEY__"

  BITRIX24_APP_CLIENT_SECRET: "__BITRIX24_APP_CLIENT_SECRET__"

  # Ключ LLM-провайдера. Для Groq — gsk_... (бесплатный tier). Для Cloud.ru FM —
  # формат base64(key_id-uuid).secret (Bearer напрямую, но модели платные → 402).
  LLM_FAST_API_KEY: "__LLM_FAST_API_KEY__"
  LLM_SMART_API_KEY: "__LLM_SMART_API_KEY__"
  # Прокси для LLM (httpx-формат socks5://user:pass@host:port). Нужен, когда
  # провайдер геоблокирует RU-IP (Groq). Тот же Xray, что Telegram. Пусто => без прокси.
  LLM_PROXY_URL: "__LLM_PROXY_URL__"

  TELEGRAM_API_HASH: "__TELEGRAM_API_HASH__"
  # Пароль SOCKS5-инбаунда Xray-прокси (см. secret xray-config / 12-xray.yaml).
  # Должен совпадать с accounts[].pass в конфиге Xray.
  TELEGRAM_PROXY_PASS: "__TELEGRAM_PROXY_PASS__"

  # SMTP для транзакционной почты (verify/reset). SMTP_USER — полный адрес
  # ящика; SMTP_PASSWORD — пароль приложения (для Яндекса). EMAIL_FROM обычно
  # совпадает с SMTP_USER (личный ящик Яндекса не даёт слать «от чужого» адреса).
  SMTP_USER: "__SMTP_USER__"
  SMTP_PASSWORD: "__SMTP_PASSWORD__"
  EMAIL_FROM: "__EMAIL_FROM__"
