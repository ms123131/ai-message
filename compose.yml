# docker-compose для ai-message
#
# Запуск (production-режим):
#   docker compose up -d --build
#
# Доступ:
#   web (через nginx): http://localhost:8080
#   api (напрямую):   http://localhost:8000 (можно закомментировать ports в проде)
#   postgres:         localhost:5432 (для отладки)

name: ai-message

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimessage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimessage}
      POSTGRES_DB: ${POSTGRES_DB:-aimessage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimessage} -d ${POSTGRES_DB:-aimessage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт 5432 НЕ публикуется в production. Для локальной отладки добавьте
    # его через compose.override.yml (см. compose.override.example.yml).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF appendfsync=everysec: при штатном рестарте задачи переживают,
    # при kill -9 теряем максимум 1с очереди. CPU-оверхед минимален.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    # One-shot контейнер: применяет миграции Alembic и выходит.
    # api ждёт его успешного завершения через service_completed_successfully.
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["run-migrations"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aimessage}:${POSTGRES_PASSWORD:-aimessage}@postgres:5432/${POSTGRES_DB:-aimessage}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY-}

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aimessage}:${POSTGRES_PASSWORD:-aimessage}@postgres:5432/${POSTGRES_DB:-aimessage}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY-}
      LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-null}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL-}
      LLM_FAST_API_KEY: ${LLM_FAST_API_KEY-}
      LLM_FAST_BASE_URL: ${LLM_FAST_BASE_URL-}
      LLM_SMART_PROVIDER: ${LLM_SMART_PROVIDER:-null}
      LLM_SMART_MODEL: ${LLM_SMART_MODEL-}
      LLM_SMART_API_KEY: ${LLM_SMART_API_KEY-}
      LLM_SMART_BASE_URL: ${LLM_SMART_BASE_URL-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL-}
      BITRIX24_APP_CLIENT_ID: ${BITRIX24_APP_CLIENT_ID-}
      BITRIX24_APP_CLIENT_SECRET: ${BITRIX24_APP_CLIENT_SECRET-}
    # Порт 8000 НЕ публикуется в production — фронт ходит через nginx-прокси.
    # Для локальной отладки (Swagger напрямую) добавьте публикацию через
    # compose.override.yml.

  worker:
    # Воркер фоновых задач (arq). Тот же образ, что и api, но другой
    # entrypoint: `run-worker` → `arq app.workers.settings.WorkerSettings`.
    # Берёт DATABASE_URL/REDIS_URL/Bitrix-секреты из тех же env, что и api.
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["run-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aimessage}:${POSTGRES_PASSWORD:-aimessage}@postgres:5432/${POSTGRES_DB:-aimessage}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY-}
      LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-null}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL-}
      LLM_FAST_API_KEY: ${LLM_FAST_API_KEY-}
      LLM_FAST_BASE_URL: ${LLM_FAST_BASE_URL-}
      LLM_SMART_PROVIDER: ${LLM_SMART_PROVIDER:-null}
      LLM_SMART_MODEL: ${LLM_SMART_MODEL-}
      LLM_SMART_API_KEY: ${LLM_SMART_API_KEY-}
      LLM_SMART_BASE_URL: ${LLM_SMART_BASE_URL-}
      BITRIX24_APP_CLIENT_ID: ${BITRIX24_APP_CLIENT_ID-}
      BITRIX24_APP_CLIENT_SECRET: ${BITRIX24_APP_CLIENT_SECRET-}
      BITRIX24_POLL_INTERVAL_SEC: ${BITRIX24_POLL_INTERVAL_SEC:-30}
      BITRIX24_POLL_WINDOW_DAYS: ${BITRIX24_POLL_WINDOW_DAYS:-1}
      BITRIX24_CRM_SYNC_INTERVAL_SEC: ${BITRIX24_CRM_SYNC_INTERVAL_SEC:-300}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # В прод-сборке фронт ходит на тот же origin через nginx-прокси
        # (роуты уже включают префикс `/api/v1/...`), поэтому base — пустая строка.
        VITE_API_URL: ${VITE_API_URL-}
    restart: unless-stopped
    # Ждём, пока api пройдёт healthcheck — иначе при первом старте nginx
    # резолвит несуществующий апстрим, и пока DNS-TTL не истечёт, страница
    # отдаёт Bad Gateway. С resolver в nginx.conf nginx перерезолвит
    # автоматически, но healthy-зависимость снижает шанс уловить миг
    # cold-start даже при первом заходе пользователя.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  redis_data:
