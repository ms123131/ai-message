name: Deploy

# CD в учебный кластер Cloud.ru (ns ai-message) на merge в main.
# Образы собираются на GitHub-hosted runner через buildx (после перехода на
# CPU-only torch образ api ~1.5-2 ГБ — runner с 14 ГБ диска тянет легко;
# in-cluster Kaniko `infra/scripts/kbuild.sh` остаётся как ручной fallback),
# пушатся в реестр, затем `kubectl set image` + `rollout status`.
#
# Требуемые секреты репозитория (Settings → Secrets and variables → Actions):
#   REGISTRY_USERNAME   — логин сервис-аккаунта Cloud.ru с push в реестр
#   REGISTRY_PASSWORD   — его секрет/пароль
#   KUBECONFIG_B64      — `base64 -w0 ~/.kube/config` рабочего kubeconfig кластера
# Реестр и namespace вынесены в env ниже — менять там, не в шагах.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ai-mesaas.cr.cloud.ru
  NAMESPACE: ai-message
  IMAGE_API: ai-mesaas.cr.cloud.ru/ai-message-api
  IMAGE_WEB: ai-mesaas.cr.cloud.ru/ai-message-web

jobs:
  build-api:
    name: Build & push api image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push (api)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build & push web image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Контекст — корень репо: web Dockerfile копирует pnpm-манифесты и оба
      # фронта (apps/web + apps/marketing). VITE_API_URL пуст = тот же origin.
      - name: Build & push (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Rollout to k8s
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    timeout-minutes: 15
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set images
        run: |
          API="${IMAGE_API}:${GITHUB_SHA}"
          WEB="${IMAGE_WEB}:${GITHUB_SHA}"
          # api: и init-контейнер migrate, и основной контейнер api — на новом коде.
          kubectl -n "$NAMESPACE" set image deployment/api    migrate="$API" api="$API"
          kubectl -n "$NAMESPACE" set image deployment/worker  worker="$API"
          kubectl -n "$NAMESPACE" set image deployment/web     web="$WEB"

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/api    --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/worker --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/web    --timeout=180s

      - name: Deployed images
        if: always()
        run: |
          kubectl -n "$NAMESPACE" get deploy api worker web \
            -o 'custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image'
