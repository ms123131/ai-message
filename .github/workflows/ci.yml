name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (build + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm --filter @ai-message/web typecheck

      - name: Build (web)
        run: pnpm --filter @ai-message/web build

      - name: Upload web build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.ref_name }}-${{ github.sha }}
          path: apps/web/dist
          retention-days: 7

  api:
    name: api (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aimessage
          POSTGRES_PASSWORD: aimessage
          POSTGRES_DB: aimessage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimessage -d aimessage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch отдельным шагом: plain pip не читает [tool.uv.sources]
          # из pyproject и иначе тянул бы CUDA-сборку (~2 ГБ) на linux-runner.
          # Ставится до пакета — `pip install -e .` видит torch уже удовлетворённым.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests (pytest)
        run: pytest -q

      - name: Alembic migrations (Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://aimessage:aimessage@localhost:5432/aimessage
          APP_ENV: ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    name: api (docker build)
    runs-on: ubuntu-latest
    needs: api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: ai-message-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
