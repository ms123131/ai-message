[project]
name = "ai-message-api"
version = "0.0.1"
description = "Backend для ai-message — анализ коммуникационных каналов"
requires-python = ">=3.12"
dependencies = [
    # Верхняя граница: fastapi 0.137 ломает prometheus-fastapi-instrumentator
    # (роуты include_router становятся `_IncludedRouter` без атрибута `.path`
    # → AttributeError на каждом запросе, в т.ч. /health → 500). 0.136.3 рабочая.
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # [socks] => тянет socksio, нужен httpx для socks5:// прокси (LLM_PROXY_URL
    # через Xray в обход геоблока egress; python-socks ниже — только для Telethon).
    "httpx[socks]>=0.27.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "email-validator>=2.2.0",
    "arq>=0.26.1",
    "redis>=5.0.0",
    # Асинхронная отправка транзакционных писем (verify/reset) через SMTP.
    "aiosmtplib>=3.0.0",
    "cryptography>=43.0.0",
    "slowapi>=0.1.9",
    "natasha>=1.6.0",
    "pgvector>=0.3.6",
    # torch указан явной зависимостью, чтобы привязать его к CPU-индексу
    # PyTorch (см. [tool.uv.sources] ниже). Нода кластера CPU-only — CUDA-сборка
    # тянула ~1.5 ГБ nvidia-* пакетов впустую и раздувала образ api до ~5-6 ГБ.
    # CPU-колёса (`+cpu`) ужимают образ кратно и ускоряют pull/деплой.
    "torch>=2.2.0",
    # sentence-transformers тянет torch — воркер должен уметь считать
    # эмбеддинги без отдельной сборки. При недоступности (`pip install` без
    # сети) app/nlp/embeddings.py gracefully падает в null-режим, как Natasha.
    "sentence-transformers>=3.0.0",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Personal Telegram (MTProto). Импортируется lazily — если пакет
    # недоступен, /integrations/telegram-user/* отвечает 503; остальные
    # фичи API продолжают работать.
    "telethon>=1.36.0",
    # SOCKS5-прокси для Telethon (MTProto через Xray, см. telegram_proxy_*).
    # Telethon использует python-socks для асинхронного SOCKS.
    "python-socks[asyncio]>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
]

[tool.uv.sources]
# torch берём из CPU-индекса PyTorch на всех платформах: нода CPU-only,
# CUDA-сборка не нужна и только раздувает образ. explicit-индекс ниже
# используется ТОЛЬКО для torch — остальное резолвится с PyPI.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",  # assert разрешён в тестах
    "B008",  # FastAPI Depends() в дефолтах — стандартный паттерн
    "UP042", # str+Enum мульти-наследование оставляем — StrEnum пока менее распространён
    "S105",  # ложные срабатывания для URL и значений-плейсхолдеров; реальные секреты в .env
    "B904",  # raise from — добавим позже точечно где нужна цепочка
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"app/api/v1/install.py" = ["E501"]
# HTML-шаблоны писем: инлайн-стили дают длинные строки, разбивать вредно.
"app/email/render.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
