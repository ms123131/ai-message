# Один nginx-образ обслуживает два сайта, разделяя их по Host:
#   77ais.ru      → маркетинговый лендинг (apps/marketing) в html/marketing
#   app.77ais.ru  → SPA-приложение (apps/web) в html/app + прокси на backend
#
# Локально через docker compose домены не резолвятся — добавьте в /etc/hosts:
#   127.0.0.1 77ais.ru app.77ais.ru
# либо ходите на app.77ais.ru напрямую (это default_server — см. ниже).

# Docker embedded DNS (127.0.0.11) — нужен для динамической ре-резолюции
# имени `api` после пересоздания контейнера. Без этого nginx кэширует IP
# при старте и после `docker compose up --build api` ловит Bad Gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Лендинг: 77ais.ru ──────────────────────────────────────────────────────
# default_server: любой неузнанный Host тоже получит лендинг.
server {
    listen 80 default_server;
    server_name 77ais.ru;
    root /usr/share/nginx/html/marketing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Лендинг статичен — backend ему не нужен. CSP без frame-ancestors послаблений.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}

# ── Приложение: app.77ais.ru ───────────────────────────────────────────────
server {
    listen 80;
    server_name app.77ais.ru;
    root /usr/share/nginx/html/app;
    index index.html;

    # SPA-fallback: неизвестный путь возвращает index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси к backend. При `proxy_pass <переменная>` nginx НЕ делает URI rewrite
    # по location-префиксу — $request_uri уходит как есть (/api/v1/... → /api/v1/...).
    set $api_backend "http://api:8000";

    location /api/ {
        proxy_pass         $api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Webhooks от внешних систем (короткий публичный URL).
    location /webhooks/ {
        rewrite ^/webhooks/(.*)$ /api/v1/webhooks/$1 break;
        proxy_pass         $api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size 5m;
    }

    # Страница установки Bitrix24 — открывается в iframe внутри портала.
    # Подменяем X-Frame-Options и CSP frame-ancestors под *.bitrix24.* клиентов.
    location /install/ {
        rewrite ^/install/(.*)$ /api/v1/install/$1 break;
        proxy_pass         $api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        add_header         X-Frame-Options "ALLOWALL" always;
        add_header         Content-Security-Policy "frame-ancestors https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.by https://*.bitrix24.kz https://*.bitrix24.eu https://*.bitrix24.de" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
