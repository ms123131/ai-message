server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: любой неизвестный путь возвращает index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси к backend под общим origin'ом (избегаем CORS)
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Webhooks от внешних систем (короткий публичный URL).
    # Внутри API роуты живут под /api/v1/webhooks/.
    location /webhooks/ {
        proxy_pass         http://api:8000/api/v1/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size 5m;
    }

    # Страница установки Bitrix24 — открывается в iframe внутри портала.
    # Глобальный X-Frame-Options: SAMEORIGIN ломает iframe, поэтому здесь
    # подменяем заголовок на разрешающий, плюс ослабляем CSP frame-ancestors
    # для произвольных *.bitrix24.* поддоменов клиентов.
    location /install/ {
        proxy_pass         http://api:8000/api/v1/install/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        add_header         X-Frame-Options "ALLOWALL" always;
        add_header         Content-Security-Policy "frame-ancestors https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.by https://*.bitrix24.kz https://*.bitrix24.eu https://*.bitrix24.de" always;
    }

    # Кэширование статических ассетов с хэшами в имени
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content-Security-Policy. Жёсткая политика для SPA:
    # - default-src 'self' — всё с того же origin
    # - 'unsafe-inline' для style — нужен Tailwind/Recharts (inline styles в SVG)
    # - script-src без unsafe-inline/eval — Vite собирает чистые модули
    # - img-src + data: и https: для аватаров операторов B24 и иконок каналов
    # - connect-src 'self' — фронт ходит на свой origin (API через nginx-прокси)
    # - frame-ancestors 'self' — основной SPA не должен встраиваться никуда;
    #   для /install/ переопределяется выше под B24-домены
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
